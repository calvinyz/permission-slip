<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permission Slip</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23000%22/%3E%3Crect x=%224%22 y=%224%22 width=%228%22 height=%225%22 rx=%221%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <h1>Permission Slip</h1>
      <span id="company" class="muted"></span>
    </div>
    <div class="status-row">
      <span class="conn" id="conn-ramp" data-state="unknown"><i></i><span>Gateway</span></span>
      <span class="conn" id="conn-dash" data-state="unknown"><i></i><span>Live</span></span>
      <span class="tag" id="brain"></span>
    </div>
    <div class="clock" aria-label="Current time">
      <span id="clock-time">--:--:--</span>
      <span id="clock-date" class="muted"></span>
    </div>
  </header>

  <aside class="rail" aria-label="Requests">
    <div class="rail-h">
      <h2>Requests</h2>
      <button type="button" id="follow" class="follow" aria-pressed="true" title="Always show the newest request (F)">Follow latest</button>
    </div>
    <div id="chips" class="chips"></div>
    <p class="motto">The language model negotiates. The policy engine decides. The signed mandate enforces.</p>
  </aside>

  <main class="detail">
    <section class="req-head" aria-live="polite">
      <div class="req-main">
        <h2 id="rq-title">No requests yet</h2>
        <p id="rq-desc" class="muted"></p>
        <p id="rq-meta" class="muted"></p>
      </div>
      <div class="req-side">
        <span id="rq-amount" class="amount"></span>
        <span id="rq-status"></span>
      </div>
    </section>

    <section class="timeline" aria-label="Request progress">
      <ol id="steps"></ol>
    </section>

    <div class="grid">
      <section class="panel" id="p-convo" aria-labelledby="h-convo">
        <div class="panel-h"><h3 id="h-convo">Conversation</h3><span id="convo-meta" class="tag"></span></div>
        <div id="convo" class="convo" aria-live="polite"></div>
      </section>
      <section class="panel" id="p-policy" aria-labelledby="h-policy">
        <div class="panel-h"><h3 id="h-policy">Decision</h3><span id="policy-version" class="tag"></span></div>
        <div id="policy" class="policy" aria-live="polite"></div>
      </section>
      <section class="panel" id="p-card" aria-labelledby="h-card">
        <div class="panel-h"><h3 id="h-card">Card and mandate</h3><span id="card-timer" class="tag"></span></div>
        <div id="card" class="cardpanel" aria-live="polite"></div>
      </section>
      <section class="panel" id="p-txn" aria-labelledby="h-txn">
        <div class="panel-h"><h3 id="h-txn">Charge</h3></div>
        <div id="txn" class="txnpanel" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <footer class="foot">
    <span class="keys muted"><kbd>←</kbd><kbd>→</kbd> switch request <kbd>F</kbd> follow latest <kbd>L</kbd> event log <kbd>T</kbd> theme</span>
    <button type="button" id="logbtn" class="linkbtn" aria-expanded="false" aria-controls="rawlog">Show event log</button>
  </footer>
  <section id="rawlog" class="rawlog" hidden aria-label="Event log"><pre id="rawlog-pre"></pre></section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
