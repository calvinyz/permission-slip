# Slack app for Permission Slip (test workspace only; no publishing needed).
# api.slack.com/apps -> Create New App -> From an app manifest -> paste this.
# Then: Basic Information -> App-Level Tokens -> generate one with connections:write (SLACK_APP_TOKEN, xapp-...)
#       Install App -> copy the Bot User OAuth Token (SLACK_BOT_TOKEN, xoxb-...)
display_information:
  name: Permission Slip
  description: Manager approvals and finance alerts for AI agents spending company money
  background_color: "#1b2140"
features:
  bot_user:
    display_name: Permission Slip
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
