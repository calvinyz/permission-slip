openapi: 3.1.0
info:
  title: Permission Slip Gateway API
  version: 0.1.2
  description: |
    The interface between the conversational services (messaging channels,
    the negotiator, the Slack approvals bot, the live dashboard) and the
    gateway, which verifies claims, applies policy, signs mandates, issues
    cards and reconciles settlement. Conversational services talk; the
    gateway decides. Nothing outside the gateway can approve spend.

    Schemas under `components.schemas` are JSON Schema 2020-12 and are the
    single source of truth for every service's contract tests. Treat changes
    as breaking by default and bump `info.version` with each one.

    Conventions:
    - Money is `amount_usd`, a JSON number in dollars with at most 2 decimals.
    - Timestamps are RFC 3339 UTC strings (`2026-10-27T15:04:05Z`).
    - IDs are prefixed strings: `req_`, `esc_`, `mdt_`, `card_`, `txn_`,
      `chg_`, `evt_`, `emp_`.
servers:
  - url: http://localhost:8000
    description: Gateway, local development
security:
  - bearer: []

paths:
  /healthz:
    get:
      operationId: health
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }

  /v1/requests:
    post:
      operationId: submitRequest
      summary: Submit a structured purchase request; returns a decision
      description: |
        `request_id` is generated by the agent side and is an idempotency key:
        resubmitting the same body returns the current decision; reusing an id
        with a different body returns 409.

        A `denied` or `counter` decision is final for that request. To accept a
        counteroffer, submit a new request with `parent_request_id` set to the
        countered request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseRequest" }
            examples:
              happy_path:
                $ref: "#/components/examples/HappyPathRequest"
      responses:
        "200":
          description: Decision (any status, including denied)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
              examples:
                approved:
                  $ref: "#/components/examples/ApprovedDecision"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/requests/{request_id}:
    get:
      operationId: getRequest
      summary: Current decision for a request (poll while escalated)
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Current decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
              examples:
                approved:
                  $ref: "#/components/examples/ApprovedDecision"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/escalations/{escalation_id}/resolve:
    post:
      operationId: resolveEscalation
      summary: Manager approves or denies an escalated request
      parameters:
        - name: escalation_id
          in: path
          required: true
          schema: { type: string, pattern: "^esc_[A-Za-z0-9_-]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EscalationResolution" }
      responses:
        "200":
          description: Updated decision for the escalated request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: resolver_id is not the escalation's approver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/mandates/{mandate_id}:
    get:
      operationId: getMandate
      summary: Signed mandate, for the dashboard and audit
      parameters:
        - name: mandate_id
          in: path
          required: true
          schema: { type: string, pattern: "^mdt_[A-Za-z0-9_-]+$" }
      responses:
        "200":
          description: Mandate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mandate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/cards/{card_id}:
    get:
      operationId: getCard
      summary: Full card details for checkout (backs the MCP `get_card` tool)
      description: Sandbox only. Returns the PAN and CVC the personal agent needs to check out.
      parameters:
        - name: card_id
          in: path
          required: true
          schema: { type: string, pattern: "^card_[A-Za-z0-9_-]+$" }
      responses:
        "200":
          description: Card with checkout details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/events:
    get:
      operationId: streamEvents
      summary: Live Server-Sent Events stream of every step
      description: |
        Each SSE message has `id: <seq>`, `event: <type>` and `data: <Event JSON>`.
        Reconnect with the standard `Last-Event-ID` header, or pass `since`, to
        replay every event after that seq. `since=0` replays everything.

        Browsers' `EventSource` cannot set headers, so browser clients first
        exchange the bearer token for a stream ticket (`POST /v1/events/tickets`)
        and pass it as `ticket`. Tickets are single-use and expire after 60
        seconds, so they are harmless if they end up in logs. On reconnect,
        fetch a new ticket and resume with `since` set to the last seq seen.
      security:
        - bearer: []
        - {}
      parameters:
        - name: ticket
          in: query
          required: false
          description: Stream ticket, in place of the Authorization header.
          schema: { type: string, pattern: "^tkt_[A-Za-z0-9_-]+$" }
        - name: since
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Event stream; each `data` line is an `Event`
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/events/tickets:
    post:
      operationId: createStreamTicket
      summary: Exchange the bearer token for a single-use event stream ticket
      responses:
        "201":
          description: Ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /merchant/charge:
    post:
      operationId: chargeCard
      summary: Demo merchant charges a card; triggers settlement
      description: |
        Called by the demo merchant's checkout page. Authorization checks only
        that the card exists, is active and unexpired; the amount is not
        enforced at auth so the overcharge scenario can settle and be caught by
        the reconciler. Settlement and reconciliation events follow on the
        stream.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChargeRequest" }
      responses:
        "200":
          description: Charge result (authorized or declined)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Charge" }
        "400": { $ref: "#/components/responses/BadRequest" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Shared service token (`GATEWAY_API_TOKEN`).

  parameters:
    RequestId:
      name: request_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/RequestId" }

  responses:
    BadRequest:
      description: Body failed schema validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or wrong bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Idempotency conflict or already resolved
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    RequestId:
      type: string
      pattern: "^req_[A-Za-z0-9_-]+$"
    EmployeeId:
      type: string
      pattern: "^emp_[a-z0-9_]+$"
    AgentId:
      type: string
      description: "`<agent>:<handle>`, e.g. `instinct:+15551234567` or `claude:tok_dev`"
      pattern: "^(instinct|muse|claude|chatgpt|redteam):.+$"
    Timestamp:
      type: string
      format: date-time
    Amount:
      type: number
      exclusiveMinimum: 0
      maximum: 100000
      description: Dollars, at most 2 decimal places (round on write; not schema-enforced because float multipleOf is unreliable).
    MerchantCategory:
      type: string
      enum:
        - airlines
        - lodging
        - ground_transport
        - conferences
        - meals
        - software
        - office_supplies
        - other

    Travel:
      type: object
      description: |
        Structured trip details. The gateway denies `airlines` requests without
        `cabin_class`, `origin` and `destination`, and `lodging` requests without
        `nights` (which must match `return_date - depart_date` when both are given).
        Free text must agree with these fields: an `economy` flight whose
        description mentions first class, business class or an upgrade is denied.
      additionalProperties: false
      properties:
        cabin_class:
          type: string
          enum: [economy, premium_economy, business, first]
        origin: { type: string, pattern: "^[A-Z]{3}$" }
        destination: { type: string, pattern: "^[A-Z]{3}$" }
        depart_date: { type: string, format: date }
        return_date: { type: string, format: date }
        nights: { type: integer, minimum: 1 }

    TranscriptMessage:
      type: object
      additionalProperties: false
      required: [role, text]
      properties:
        role:
          type: string
          enum: [employee, personal_agent, negotiator]
        text: { type: string }
        ts: { $ref: "#/components/schemas/Timestamp" }

    PurchaseRequest:
      type: object
      additionalProperties: false
      required:
        - request_id
        - agent_id
        - channel
        - employee_id
        - merchant
        - merchant_category
        - amount_usd
        - description
        - justification
      properties:
        request_id: { $ref: "#/components/schemas/RequestId" }
        parent_request_id:
          description: Set when accepting a counteroffer on an earlier request.
          $ref: "#/components/schemas/RequestId"
        agent_id: { $ref: "#/components/schemas/AgentId" }
        channel:
          type: string
          enum: [sms, email, mcp]
        employee_id: { $ref: "#/components/schemas/EmployeeId" }
        merchant: { type: string, minLength: 1, maxLength: 200 }
        merchant_category: { $ref: "#/components/schemas/MerchantCategory" }
        amount_usd: { $ref: "#/components/schemas/Amount" }
        description: { type: string, minLength: 1, maxLength: 1000 }
        justification: { type: string, minLength: 1, maxLength: 1000 }
        travel: { $ref: "#/components/schemas/Travel" }
        claims:
          type: object
          description: Facts the agent asserts; every one is verified, none is trusted.
          properties:
            meeting: { type: string }
            event: { type: string }
            date: { type: string, format: date }
          additionalProperties: { type: string }
        transcript:
          type: array
          description: Raw conversation, stored for the audit trail only. Never used to decide.
          items: { $ref: "#/components/schemas/TranscriptMessage" }

    DecisionStatus:
      type: string
      enum: [approved, counter, escalated, denied]

    PolicyTraceItem:
      type: object
      additionalProperties: false
      required: [rule, result]
      properties:
        rule: { type: string, description: "Dotted rule id, e.g. `travel.air.class`" }
        result: { type: string, enum: [pass, fail, skip] }
        detail: { type: string }

    VerificationItem:
      type: object
      additionalProperties: false
      required: [check, result]
      properties:
        check:
          type: string
          description: "e.g. `employee.exists`, `calendar.meeting`, `price.fare_history`, `budget.team`"
        result: { type: string, enum: [verified, unverified, failed] }
        detail: { type: string }

    Counteroffer:
      type: object
      additionalProperties: false
      required: [merchant, merchant_category, amount_usd, description, reason]
      properties:
        merchant: { type: string }
        merchant_category: { $ref: "#/components/schemas/MerchantCategory" }
        amount_usd: { $ref: "#/components/schemas/Amount" }
        description: { type: string }
        travel: { $ref: "#/components/schemas/Travel" }
        reason: { type: string }

    Escalation:
      type: object
      additionalProperties: false
      required: [escalation_id, request_id, approver_id, status, opened_at]
      properties:
        escalation_id: { type: string, pattern: "^esc_[A-Za-z0-9_-]+$" }
        request_id: { $ref: "#/components/schemas/RequestId" }
        approver_id: { $ref: "#/components/schemas/EmployeeId" }
        status: { type: string, enum: [open, approved, denied] }
        reason: { type: string, description: Why it was escalated }
        opened_at: { $ref: "#/components/schemas/Timestamp" }
        resolved_at: { $ref: "#/components/schemas/Timestamp" }
        note: { type: string }

    EscalationResolution:
      type: object
      additionalProperties: false
      required: [action, resolver_id]
      properties:
        action: { type: string, enum: [approve, deny] }
        resolver_id: { $ref: "#/components/schemas/EmployeeId" }
        note: { type: string, maxLength: 1000 }

    CardStatus:
      type: string
      enum: [active, suspended, closed]

    CardBase:
      type: object
      required: [card_id, mandate_id, last4, limit_usd, merchant_lock, expires_at, status]
      properties:
        card_id: { type: string, pattern: "^card_[A-Za-z0-9_-]+$" }
        mandate_id: { type: string, pattern: "^mdt_[A-Za-z0-9_-]+$" }
        last4: { type: string, pattern: "^[0-9]{4}$" }
        limit_usd: { $ref: "#/components/schemas/Amount" }
        merchant_lock: { $ref: "#/components/schemas/MerchantCategory" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        status: { $ref: "#/components/schemas/CardStatus" }

    Card:
      allOf:
        - $ref: "#/components/schemas/CardBase"
      unevaluatedProperties: false

    CardDetails:
      allOf:
        - $ref: "#/components/schemas/CardBase"
        - type: object
          required: [pan, cvc, exp_month, exp_year]
          properties:
            pan: { type: string, pattern: "^[0-9]{16}$" }
            cvc: { type: string, pattern: "^[0-9]{3}$" }
            exp_month: { type: integer, minimum: 1, maximum: 12 }
            exp_year: { type: integer, minimum: 2026 }
      unevaluatedProperties: false

    Decision:
      type: object
      additionalProperties: false
      required:
        - request_id
        - status
        - reason
        - policy_trace
        - verification
        - policy_version
        - decided_at
        - counteroffer
        - escalation
        - mandate_id
        - card
      properties:
        request_id: { $ref: "#/components/schemas/RequestId" }
        status: { $ref: "#/components/schemas/DecisionStatus" }
        reason: { type: string, description: One plain-English sentence the negotiator can relay. }
        policy_trace:
          type: array
          items: { $ref: "#/components/schemas/PolicyTraceItem" }
        verification:
          type: array
          items: { $ref: "#/components/schemas/VerificationItem" }
        policy_version: { type: string }
        decided_at: { $ref: "#/components/schemas/Timestamp" }
        counteroffer:
          description: Present only when status is `counter`.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Counteroffer"
        escalation:
          description: Present once the request has been escalated (stays after resolution).
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Escalation"
        mandate_id:
          description: Present only when status is `approved`.
          oneOf:
            - type: "null"
            - { type: string, pattern: "^mdt_[A-Za-z0-9_-]+$" }
        card:
          description: Present only when status is `approved`. Use GET /v1/cards/{card_id} for the PAN.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Card"

    Mandate:
      type: object
      additionalProperties: false
      description: |
        The approval, bound and signed. `signature` is Ed25519 over the
        RFC 8785 (JCS) canonical JSON of the mandate with `signature`
        removed, base64-encoded. Verify with `public_key` (raw 32 bytes,
        base64). In JS: `canonicalize` npm package + `tweetnacl`.
      required:
        - mandate_id
        - request_id
        - employee_id
        - agent_id
        - merchant
        - merchant_category
        - amount_usd
        - justification
        - policy_version
        - verification
        - valid_from
        - valid_until
        - card_id
        - key_id
        - public_key
        - signature
      properties:
        mandate_id: { type: string, pattern: "^mdt_[A-Za-z0-9_-]+$" }
        request_id: { $ref: "#/components/schemas/RequestId" }
        employee_id: { $ref: "#/components/schemas/EmployeeId" }
        agent_id: { $ref: "#/components/schemas/AgentId" }
        merchant: { type: string }
        merchant_category: { $ref: "#/components/schemas/MerchantCategory" }
        amount_usd: { $ref: "#/components/schemas/Amount" }
        justification: { type: string }
        policy_version: { type: string }
        verification:
          type: array
          items: { $ref: "#/components/schemas/VerificationItem" }
        approved_by:
          description: Manager who approved, if it went through escalation.
          $ref: "#/components/schemas/EmployeeId"
        valid_from: { $ref: "#/components/schemas/Timestamp" }
        valid_until: { $ref: "#/components/schemas/Timestamp" }
        card_id: { type: string, pattern: "^card_[A-Za-z0-9_-]+$" }
        key_id: { type: string }
        public_key: { type: string, contentEncoding: base64 }
        signature: { type: string, contentEncoding: base64 }

    ChargeRequest:
      type: object
      additionalProperties: false
      required: [pan, cvc, exp_month, exp_year, merchant, merchant_category, amount_usd]
      properties:
        pan: { type: string, pattern: "^[0-9]{16}$" }
        cvc: { type: string, pattern: "^[0-9]{3}$" }
        exp_month: { type: integer, minimum: 1, maximum: 12 }
        exp_year: { type: integer, minimum: 2026 }
        merchant: { type: string }
        merchant_category: { $ref: "#/components/schemas/MerchantCategory" }
        amount_usd: { $ref: "#/components/schemas/Amount" }
        description: { type: string }

    Charge:
      type: object
      additionalProperties: false
      required: [charge_id, status, amount_usd]
      properties:
        charge_id: { type: string, pattern: "^chg_[A-Za-z0-9_-]+$" }
        status: { type: string, enum: [authorized, declined] }
        decline_reason:
          type: string
          enum: [card_not_found, card_suspended, card_closed, card_expired, card_details_mismatch]
        amount_usd: { $ref: "#/components/schemas/Amount" }
        card_id: { type: string, pattern: "^card_[A-Za-z0-9_-]+$" }
        txn_id: { type: string, pattern: "^txn_[A-Za-z0-9_-]+$" }

    MatchCheck:
      type: object
      additionalProperties: false
      required: [field, expected, actual, result]
      properties:
        field: { type: string, enum: [merchant_category, amount_usd, time_window] }
        expected: { type: string }
        actual: { type: string }
        result: { type: string, enum: [match, mismatch] }

    Coding:
      type: object
      additionalProperties: false
      required: [gl_account, department, memo]
      properties:
        gl_account: { type: string, description: "e.g. `6100 Travel - Airfare`" }
        department: { type: string }
        memo: { type: string }

    Transaction:
      type: object
      additionalProperties: false
      required: [txn_id, card_id, mandate_id, request_id, merchant, merchant_category, amount_usd, settled_at, status]
      properties:
        txn_id: { type: string, pattern: "^txn_[A-Za-z0-9_-]+$" }
        card_id: { type: string, pattern: "^card_[A-Za-z0-9_-]+$" }
        mandate_id: { type: string, pattern: "^mdt_[A-Za-z0-9_-]+$" }
        request_id: { $ref: "#/components/schemas/RequestId" }
        merchant: { type: string }
        merchant_category: { $ref: "#/components/schemas/MerchantCategory" }
        amount_usd: { $ref: "#/components/schemas/Amount" }
        settled_at: { $ref: "#/components/schemas/Timestamp" }
        status: { type: string, enum: [settled, reconciled, mismatch] }
        match:
          type: array
          items: { $ref: "#/components/schemas/MatchCheck" }
        coding: { $ref: "#/components/schemas/Coding" }

    StreamTicket:
      type: object
      additionalProperties: false
      required: [ticket, expires_at]
      properties:
        ticket: { type: string, pattern: "^tkt_[A-Za-z0-9_-]+$" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthorized, forbidden, not_found, conflict, internal]
            message: { type: string }
            details: {}

    # ---- Event stream ------------------------------------------------------

    EventType:
      type: string
      enum:
        - request.received
        - claims.verified
        - policy.decided
        - escalation.opened
        - escalation.resolved
        - mandate.signed
        - card.issued
        - txn.settled
        - txn.reconciled
        - txn.mismatch
        - card.suspended
        - injection.blocked

    Event:
      type: object
      description: Envelope for every event on `/v1/events`. `data` shape depends on `type`.
      required: [event_id, seq, type, ts, request_id, data]
      properties:
        event_id: { type: string, pattern: "^evt_[A-Za-z0-9_-]+$" }
        seq: { type: integer, minimum: 1, description: Monotonic; use as Last-Event-ID }
        type: { $ref: "#/components/schemas/EventType" }
        ts: { $ref: "#/components/schemas/Timestamp" }
        request_id:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/RequestId"
        data: { type: object }
      additionalProperties: false
      oneOf:
        - properties:
            type: { const: request.received }
            data:
              type: object
              additionalProperties: false
              required: [request]
              properties:
                request: { $ref: "#/components/schemas/PurchaseRequest" }
        - properties:
            type: { const: claims.verified }
            data:
              type: object
              additionalProperties: false
              required: [verification, all_verified]
              properties:
                verification:
                  type: array
                  items: { $ref: "#/components/schemas/VerificationItem" }
                all_verified: { type: boolean }
        - properties:
            type: { const: policy.decided }
            data:
              type: object
              additionalProperties: false
              required: [status, reason, policy_trace, policy_version, counteroffer]
              properties:
                status: { $ref: "#/components/schemas/DecisionStatus" }
                reason: { type: string }
                policy_trace:
                  type: array
                  items: { $ref: "#/components/schemas/PolicyTraceItem" }
                policy_version: { type: string }
                counteroffer:
                  oneOf:
                    - type: "null"
                    - $ref: "#/components/schemas/Counteroffer"
        - properties:
            type: { const: escalation.opened }
            data:
              type: object
              additionalProperties: false
              required: [escalation]
              properties:
                escalation: { $ref: "#/components/schemas/Escalation" }
        - properties:
            type: { const: escalation.resolved }
            data:
              type: object
              additionalProperties: false
              required: [escalation]
              properties:
                escalation: { $ref: "#/components/schemas/Escalation" }
        - properties:
            type: { const: mandate.signed }
            data:
              type: object
              additionalProperties: false
              required: [mandate]
              properties:
                mandate: { $ref: "#/components/schemas/Mandate" }
        - properties:
            type: { const: card.issued }
            data:
              type: object
              additionalProperties: false
